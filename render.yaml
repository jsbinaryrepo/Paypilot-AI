# Free public demo. SQLite data is ephemeral and can be lost on restarts or redeploys.
# Set a random DEMO_PASSWORD (at least 32 characters) in Render before deployment.
services:
  - type: web
    name: paypilot-ai
    runtime: node
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    # Free services lack a persistent disk; migrate the temporary SQLite file at startup.
    startCommand: node dist/server/src/migrate.js && npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: CLIENT_ORIGIN
        value: https://paypilot-ai-3sho.onrender.com
      - key: DEMO_PASSWORD
        sync: false
      - key: LOCAL_USER_EMAIL
        value: owner@example.test
      - key: INVOICE_TIMEZONE
        value: Asia/Kolkata
      - key: PAYPAL_ENV
        value: sandbox
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
