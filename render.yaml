# Free public guest workspace. Provider credentials remain server-only.
services:
  - type: web
    name: paypilot-ai
    runtime: node
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    # Migration script selects local SQLite or hosted Turso based on ACCOUNTS_ENABLED.
    startCommand: node dist/server/src/migrate.js && npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: ACCOUNTS_ENABLED
        value: "false"
      - key: PUBLIC_GUEST_ACCESS
        value: "true"
      - key: VITE_ACCOUNTS_ENABLED
        value: "false"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CLIENT_ORIGIN
        value: https://paypilot-ai-3sho.onrender.com
      - key: VITE_PUBLIC_DEMO
        value: "false"
      - key: VITE_GUEST_MODE
        value: "true"
      - key: LOCAL_USER_EMAIL
        value: owner@example.test
      - key: INVOICE_TIMEZONE
        value: Asia/Kolkata
      - key: PAYPAL_ENV
        value: sandbox
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_BUSINESS_NAME
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
